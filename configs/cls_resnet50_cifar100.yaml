# CIFAR-100 ResNet-50 (MMPretrain official recipe), proxy search on 1 GPU.
# Usage: python run_search.py --config configs/cls_resnet50_cifar100.yaml --mode agent_reflect --seed 0
search:
  max_rounds: 10             # pilot budget; the formal classification comparison adds --max_rounds 30
  min_improvement: 0.25      # = measured proxy seed std (60-epoch proxy, baseline seeds 0/1/2: 78.06/77.66/78.12)
  noise_level: 0.25
  early_stop_patience: 0     # keep 0 in method comparisons
  max_consecutive_failures: 5

agent:
  client:
    provider: deepseek       # needs DEEPSEEK_API_KEY (never commit it); alternative: anthropic + ANTHROPIC_API_KEY
    model: deepseek-flash    # DeepSeek V4.1 Flash (for anthropic: claude-opus-5-5)
    effort: medium           # DeepSeek reasoning_effort: low->low, medium/high->high, xhigh/max->max
    thinking: false          # main comparison without thinking so baseline temperatures apply (advisor);
                             # the thinking control is a separate run: --thinking on
    use_fallbacks: true      # anthropic only: server-side refusal fallback
  search:
    reflect_every_n: 1       # v2: the Design Agent sees only the reflection, so reflect after every trial
    mutation_budget: 1
    stagnation_budget: 2
    stagnation_rounds: 3
    explore_every: 4
    # reflection v2 (2026-10-20; --reflection_version v1 restores the pilot's settings)
    design_view: reflection_only   # Design Agent: Reflector summary + tried list, no raw history
    propose_hypotheses: true       # Reflector must propose 1-3 untested combinations (<= 2 dims from best)
    confidence_eta: 0.35           # v1: 0.2
    min_evidence_strength: 0.5     # floor for supports / contradicts strength; v1: none

# Comparison methods, scaled to the 10-trial budget (see README "Comparison methods").
baselines:
  reg_evo: {population_size: 4, tournament_size: 2}
  tpe: {n_startup_trials: 3}
  genius: {}
  evoprompting: {children_per_gen: 5, top_p: 4, k: 2}
  llmatic: {p_mutation: 0.7, random_init: 2}
  lapt: {n_init: 3, k: 2, adapt_every: 2, top_r: 2}
  nader: {n_inspirations: 10, extract_every: 2, top_k: 5}

runner:
  mmpretrain_root: /root/mmpretrain          # checkout with tools/train.py and data/cifar100
  base_config: configs/resnet/resnet50_8xb16_cifar100.py
  epochs: 60                 # proxy check 2026-10-18: 30 epochs failed (proxy's best pick was 4th in full
                             # training), 60 epochs passed (tau 0.68, best pick 1st); see runs/proxy_check
  warmup_epochs: 1
  batch_size: 128
  lr: 0.1
  amp: true
  num_workers: 8
  timeout_s: 21600
