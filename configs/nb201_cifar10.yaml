# NAS-Bench-201 (cifar10), second set of experiments (2026-10-30). No training: every trial is read from
# the score table built by tools/build_nb201_table.py.
# Usage: python run_search.py --config configs/nb201_cifar10.yaml --task nb201_cifar10 #            --score_table runs/score_table_nb201/nb201_cifar10.json --mode agent_reflect --seed 0 --max_rounds 50
search:
  max_rounds: 50
  min_improvement: 0.15       # = median seed sd of the 200-epoch results in the table (points)
  noise_level: 0.15
  early_stop_patience: 0
  max_consecutive_failures: 5

agent:
  client:
    provider: deepseek
    model: deepseek-flash
    effort: medium
    thinking: false
    use_fallbacks: true
  search:
    reflect_every_n: 1
    mutation_budget: 1
    stagnation_budget: 2
    stagnation_rounds: 3
    explore_every: 4
    design_view: reflection_only
    propose_hypotheses: false
    confidence_eta: 0.35
    min_evidence_strength: 0.5
    evidence_mode: computed
    prior_sd: 1.0
    interaction_prior_sd: 0.5
    selection: guided
    n_candidates: 4
    n_parent_options: 5
    llm_prior_sd: 0.75

# Comparison methods scaled to the 50-trial budget.
baselines:
  reg_evo: {population_size: 10, tournament_size: 3}
  tpe: {n_startup_trials: 5}
  genius: {}
  evoprompting: {children_per_gen: 5, top_p: 4, k: 2}
  llmatic: {p_mutation: 0.7, random_init: 2, param_bins: [0.2, 0.5]}   # NB201 cells have 0.07-1.5M params
  lapt: {n_init: 5, k: 3, adapt_every: 5, top_r: 3}
  nader: {n_inspirations: 10, extract_every: 2, top_k: 5}
